<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-3907 concept</title>
<style>
:root {
  --bg:#071018; --panel:#101b26f5; --line:#2e4356; --txt:#eef5fb;
  --muted:#9fb2c5; --accent:#8cd34b; --blue:#69b8ff; --warn:#ffbd59;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1520,#050a0f);color:var(--txt)}
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#07111ae8;border-bottom:1px solid #233748;backdrop-filter:blur(10px)}
header .box{margin-right:auto}
header .title{font-weight:900;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:12px;margin-top:2px}
.ui{border:1px solid #39516a;background:#132333;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}
.ui.active{border-color:var(--accent);box-shadow:0 0 0 2px #8cd34b20 inset}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.stage-shell{padding:10px;border-radius:20px;border:1px solid #273b4d;background:#0b151e;box-shadow:0 18px 46px #0007}
.stage{position:relative;aspect-ratio:1280/885;border-radius:14px;overflow:hidden;background:#333}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.lamp{position:absolute;z-index:6;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:3px;cursor:pointer}
.bulb{font-size:16px;line-height:1;opacity:.72;filter:saturate(.8);transition:.15s ease}
.lamp-label{opacity:0;transform:translateX(-5px);transition:.15s ease;pointer-events:none;white-space:nowrap;background:#06111de3;border:1px solid #3a5670;color:#fff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}
.lamp:hover .lamp-label,.lamp.active .lamp-label{opacity:1;transform:translateX(0)}
.lamp:hover .bulb,.lamp.active .bulb{opacity:1;transform:scale(1.12)}

.panel{position:fixed;right:16px;top:70px;z-index:90;width:min(530px,calc(100vw - 32px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--panel);border:1px solid #3c5268;border-radius:18px;box-shadow:0 28px 80px #000a;backdrop-filter:blur(12px);overflow:hidden;transform:translateX(calc(100% + 35px));opacity:0;transition:.22s ease}
.panel.open{transform:translateX(0);opacity:1}
.panel.switching{transform:translateX(calc(100% + 20px));opacity:.15}
.panel.minimized{max-height:62px}
.panel.minimized .panelbody,.panel.minimized .panelactions,.panel.minimized .subtitle,.panel.minimized .edit-hint{display:none}
.panelhead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:14px;border-bottom:1px solid #2a3e50}
.panelhead h2{margin:0;font-size:20px;line-height:1.16}
.subtitle{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.4}
.headbuttons{display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid #3a526b;background:#132333;color:#fff;cursor:pointer}
.edit-hint{display:none;padding:9px 14px;background:#0b263e;color:#c3e2ff;border-bottom:1px solid #2a3e50;font-size:12px}
.editmode .edit-hint{display:block}
.panelbody{padding:15px 17px 22px;overflow:auto;line-height:1.55}
.panelbody h3{font-size:15px;color:#d8edff;margin:17px 0 7px}
.panelbody h3:first-child{margin-top:0}
.panelbody p{margin:7px 0}
.panelbody ul{padding-left:20px}
.panelbody li{margin:6px 0}
.eq,.flow{margin:10px 0;padding:11px 13px;border-radius:12px;background:#081522;border:1px solid #35536e;font-weight:800;overflow-x:auto}
.flow{white-space:normal;color:#d9efff}
.note,.warn{margin-top:12px;padding:11px 12px;border-radius:12px;background:#142313;border:1px solid #4e7b3b66}
.warn{background:#2a2110;border-color:#96703d70}
.panelactions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 14px;border-top:1px solid #2a3e50;background:#0b141d}
.panelactions button{flex:1 1 auto}
[contenteditable=true]{outline:2px dashed #69b8ff88;outline-offset:6px;border-radius:7px}

.bottom{position:fixed;z-index:45;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:#07121ce8;border:1px solid #2c4255;border-radius:14px;padding:7px;backdrop-filter:blur(10px)}
.toast{position:fixed;z-index:130;left:50%;bottom:74px;transform:translate(-50%,15px);opacity:0;transition:.18s ease;background:#0d1a28;border:1px solid #4c687f;padding:9px 13px;border-radius:999px}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:820px){
  .wrap{padding:8px}
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:72vh;transform:translateY(calc(100% + 25px))}
  .panel.open{transform:translateY(0)}
  .panel.switching{transform:translateY(calc(100% + 12px));opacity:.2}
  .lamp-label{display:none}
  .bulb{font-size:14px}
  .bottom{bottom:78px;max-width:calc(100vw - 16px)}
}
</style>

<style>
#pwaInstallBtn{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:180;
  display:none;
  align-items:center;
  gap:8px;
  border:1px solid #5d9c42;
  background:linear-gradient(180deg,#285129,#193719);
  color:#f4ffe9;
  border-radius:14px;
  padding:11px 14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,.55);
}
#pwaInstallBtn.show{display:flex}
#pwaInstallBtn:hover{transform:translateY(-1px)}
@media(max-width:820px){
  #pwaInstallBtn{
    right:10px;
    bottom:86px;
    padding:10px 12px;
    font-size:13px;
  }
}

const DATA = {"e3907": {"title": "E-3907 — Desbutanizadora", "subtitle": "Separa C₄⁻ pelo topo e C₅⁺ pelo fundo.", "html": "\n        <h3>Objetivo da E-3907</h3>\n        <p>A <strong>E-3907</strong> é a desbutanizadora da seção de concentração de gases. Sua função é efetuar o corte entre os componentes mais leves e mais pesados, enviando predominantemente <strong>C₄ e mais leves pelo topo</strong> e mantendo <strong>C₅ e mais pesados no fundo</strong>.</p>\n\n        <div class=\"eq\">C₄⁻ → topo / GLP</div>\n        <div class=\"eq\">C₅⁺ → fundo / gasolina desbutanizada</div>\n\n        <h3>Princípio de separação</h3>\n        <p>Não existe uma reação química principal. A separação ocorre por <strong>equilíbrio líquido–vapor</strong>, diferença de volatilidade, refluxo no topo e calor de reboil no fundo.</p>\n\n        <div class=\"eq\">yᵢ · P ≈ xᵢ · Pᵢˢᵃᵗ</div>\n\n        <p>Onde <strong>xᵢ</strong> representa a fração do componente na fase líquida, <strong>yᵢ</strong> na fase vapor, <strong>P</strong> a pressão da torre e <strong>Pᵢˢᵃᵗ</strong> a pressão de vapor do componente.</p>\n\n        <h3>Meta operacional</h3>\n        <ul>\n          <li>Evitar C₄ excessivo na gasolina de fundo.</li>\n          <li>Evitar C₅⁺ excessivo no GLP de topo.</li>\n          <li>Manter pressão, refluxo, reboil e hidráulica dos pratos em equilíbrio.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Memorização:</strong> a E-3907 ajusta o “corte” C₄/C₅.</div>\n        "}, "pic39235": {"title": "PIC-39235 — Controle de pressão do topo", "subtitle": "Mantém a pressão da torre e influencia diretamente o equilíbrio líquido–vapor.", "html": "\n        <h3>Função</h3>\n        <p>O <strong>PIC-39235</strong> controla a pressão da região de topo da E-3907. A pressão altera as temperaturas de condensação/ebulição e, portanto, a qualidade da separação.</p>\n\n        <div class=\"eq\">Pressão ↑ → temperatura de ebulição/condensação ↑</div>\n        <div class=\"eq\">Pressão ↓ → maior tendência de vaporização</div>\n\n        <h3>Impactos de pressão alta</h3>\n        <ul>\n          <li>Aumento das temperaturas de equilíbrio.</li>\n          <li>Maior carga térmica necessária para a separação.</li>\n          <li>Possível alteração de PVR e intemperismo.</li>\n          <li>Aproximação de limites operacionais de pressão.</li>\n        </ul>\n\n        <h3>Impactos de pressão baixa</h3>\n        <ul>\n          <li>Maior volume específico do vapor.</li>\n          <li>Possível aumento de velocidade de vapor.</li>\n          <li>Maior sensibilidade hidráulica dos pratos.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Importante:</strong> pressão deve ser avaliada junto com refluxo, reboil, ΔP e especificação dos produtos.</div>\n        "}, "hot_bypass": {"title": "Hot bypass — Controle complementar de pressão", "subtitle": "Desvia vapor quente ao redor dos condensadores de topo.", "html": "\n        <h3>Função do hot bypass</h3>\n        <p>O hot bypass desvia parte do vapor quente de topo ao redor dos <strong>C-3915 A/B/C/D</strong>, reduzindo a quantidade de vapor condensada antes do vaso de topo.</p>\n\n        <div class=\"eq\">Hot bypass ↑ → condensação ↓ → tendência de pressão ↑</div>\n        <div class=\"eq\">Hot bypass ↓ → condensação ↑ → tendência de pressão ↓</div>\n\n        <h3>Por que ele é útil?</h3>\n        <ul>\n          <li>Ajuda a estabilizar a pressão da torre.</li>\n          <li>Permite ajustar a quantidade de condensação sem depender apenas da capacidade dos condensadores.</li>\n          <li>Ajuda a manter o sistema de topo dentro da faixa operacional.</li>\n        </ul>\n\n        <div class=\"warn\"><strong>Observação:</strong> a direção exata de ação da válvula e os permissivos devem ser confirmados na lógica/P&amp;ID da unidade.</div>\n        "}, "dp_pratos": {"title": "ΔP entre os pratos 8 e 14", "subtitle": "Indica a condição hidráulica dessa seção da torre.", "html": "\n        <h3>O que representa?</h3>\n        <p>O <strong>ΔP</strong> é a diferença de pressão entre dois pontos da torre, conforme indicado entre os pratos 8 e 14.</p>\n\n        <div class=\"eq\">ΔP = Pᵢₙfₑᵣᵢₒᵣ − Pₛᵤₚₑᵣᵢₒᵣ</div>\n\n        <p>O vapor precisa atravessar os pratos e a camada de líquido existente sobre eles. Essa resistência gera perda de pressão.</p>\n\n        <h3>Comportamento esperado</h3>\n        <div class=\"eq\">Vazão de vapor ↑ → ΔP ↑</div>\n        <div class=\"eq\">Carga líquida ↑ → ΔP ↑</div>\n\n        <h3>ΔP muito alto</h3>\n        <ul>\n          <li>Pode indicar sobrecarga hidráulica.</li>\n          <li>Pode sinalizar espuma ou restrição.</li>\n          <li>Pode indicar aproximação de flooding.</li>\n        </ul>\n\n        <h3>ΔP muito baixo</h3>\n        <ul>\n          <li>Pode indicar baixa carga de vapor.</li>\n          <li>Pode favorecer weeping em determinados regimes.</li>\n          <li>Pode indicar problema de medição se incoerente com as demais variáveis.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Resumo:</strong> o objetivo não é o menor ΔP possível, e sim uma faixa hidráulica estável.</div>\n        "}, "flooding": {"title": "Flooding — Inundação da torre", "subtitle": "Condição de sobrecarga hidráulica em que o vapor dificulta a descida do líquido.", "html": "\n        <h3>Como ocorre?</h3>\n        <p>Quando a velocidade do vapor aumenta muito, o líquido encontra dificuldade para descer pelos pratos.</p>\n\n        <div class=\"eq\">Vapor ↑↑ → arraste de líquido ↑ → ΔP ↑↑</div>\n\n        <h3>Sintomas possíveis</h3>\n        <ul>\n          <li>Aumento rápido de ΔP.</li>\n          <li>Instabilidade de temperaturas.</li>\n          <li>Aumento ou oscilação de níveis.</li>\n          <li>Arraste de líquido para o topo.</li>\n          <li>Piora simultânea das especificações de topo e fundo.</li>\n        </ul>\n\n        <div class=\"warn\"><strong>Atenção:</strong> flooding deve ser concluído por conjunto de evidências, e não apenas por ΔP alto.</div>\n        "}, "c3916": {"title": "C-3916 A/B — Reboilers", "subtitle": "Fornecem calor ao fundo para retirar C₄ da gasolina.", "html": "\n        <h3>Função dos reboilers</h3>\n        <p>Os <strong>C-3916 A/B</strong> fornecem energia térmica à região inferior da E-3907. Parte do líquido de fundo é aquecida, gerando vapor que retorna à torre.</p>\n\n        <div class=\"eq\">Líquido + calor → vapor + líquido</div>\n        <div class=\"eq\">C₄(l) → C₄(g)</div>\n\n        <h3>Efeito no processo</h3>\n        <p>O aumento do reboil tende a retirar mais componentes leves do fundo.</p>\n\n        <div class=\"eq\">Reboil ↑ → C₄ no fundo ↓ → PVR da gasolina ↓</div>\n\n        <h3>Riscos de excesso</h3>\n        <ul>\n          <li>Aumento da carga de vapor.</li>\n          <li>Aumento de ΔP.</li>\n          <li>Maior consumo energético.</li>\n          <li>Maior tendência de empurrar componentes mais pesados para o topo.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Resumo:</strong> o reboil controla principalmente a quantidade de leves que permanece no fundo.</div>\n        "}, "pvr": {"title": "PVR — Pressão de Vapor Reid da gasolina", "subtitle": "Indica a volatilidade da gasolina desbutanizada.", "html": "\n        <h3>O que a PVR mostra?</h3>\n        <p>A <strong>PVR</strong> mede a volatilidade da gasolina. É muito sensível à presença de componentes leves, principalmente butanos.</p>\n\n        <div class=\"eq\">C₄ na gasolina ↑ → PVR ↑</div>\n\n        <h3>Quando a PVR está alta</h3>\n        <p>Normalmente indica stripping insuficiente de C₄.</p>\n\n        <div class=\"eq\">Reboil ↑ → C₄ vaporizado ↑ → C₄ no fundo ↓ → PVR ↓</div>\n\n        <h3>Quando a PVR está muito baixa</h3>\n        <p>Pode indicar <strong>overstripping</strong>, ou seja, remoção excessiva de componentes leves, com possível perda de rendimento de gasolina.</p>\n\n        <div class=\"note\"><strong>Ação operacional:</strong> avaliar reboil, temperatura de fundo, pressão, carga e condição hidráulica antes de qualquer ajuste.</div>\n        "}, "intemperismo": {"title": "Intemperismo do GLP", "subtitle": "Ajuda a identificar excesso de componentes pesados no produto de topo.", "html": "\n        <h3>O que representa?</h3>\n        <p>O ensaio de <strong>intemperismo</strong> está relacionado à volatilidade do GLP e é útil para identificar excesso de componentes mais pesados no produto de topo.</p>\n\n        <div class=\"eq\">C₅⁺ no GLP ↑ → produto menos volátil → intemperismo tende a piorar</div>\n\n        <h3>Correção típica</h3>\n        <p>Quando o problema é excesso de C₅⁺ no topo, costuma-se atuar principalmente no refluxo e na temperatura de topo.</p>\n\n        <div class=\"eq\">Refluxo ↑ → condensação de C₅⁺ ↑ → C₅⁺ no GLP ↓</div>\n\n        <div class=\"note\"><strong>Resumo:</strong> intemperismo está fortemente ligado à qualidade do corte no topo.</div>\n        "}, "c3915": {"title": "C-3915 A/B/C/D — Condensadores de topo", "subtitle": "Retiram calor do vapor de topo e geram líquido para refluxo/produto.", "html": "\n        <h3>Função</h3>\n        <p>Os <strong>C-3915 A/B/C/D</strong> retiram calor do vapor de topo da E-3907 e promovem sua condensação antes do F-3911.</p>\n\n        <div class=\"eq\">Vapor de topo − calor → líquido condensado</div>\n\n        <h3>Por que isso é importante?</h3>\n        <ul>\n          <li>Ajuda a controlar a pressão do topo.</li>\n          <li>Gera líquido para refluxo.</li>\n          <li>Permite separar produto de topo e refluxo no vaso F-3911.</li>\n        </ul>\n\n        <div class=\"flow\">E-3907 → C-3915 → F-3911 → J-3918 → refluxo → E-3907</div>\n\n        <div class=\"note\"><strong>Resumo:</strong> sem condensação adequada, a pressão tende a subir e a disponibilidade de refluxo pode cair.</div>\n        "}, "tic39308": {"title": "TIC-39308 — Temperatura do topo", "subtitle": "Ajuda a controlar a qualidade do GLP via refluxo.", "html": "\n        <h3>Função</h3>\n        <p>O <strong>TIC-39308</strong> monitora/controla a temperatura de topo, variável diretamente associada à composição do produto de topo.</p>\n\n        <div class=\"eq\">T topo ↑ → tendência de C₅⁺ no topo ↑</div>\n\n        <h3>Resposta típica</h3>\n        <div class=\"eq\">T topo ↑ → refluxo ↑ → T topo ↓</div>\n\n        <p>O refluxo adicional condensa componentes mais pesados e os devolve à torre.</p>\n\n        <div class=\"eq\">Refluxo ↑ → C₅⁺ no GLP ↓</div>\n\n        <div class=\"warn\"><strong>Na tela:</strong> o TIC aparece em MAN. Nessa condição, a ação automática em cascata pode não estar atuando conforme a estratégia normal.</div>\n        "}, "tic39303": {"title": "TIC-39303 — Temperatura inferior", "subtitle": "Mantém a condição térmica adequada para o stripping de C₄ no fundo.", "html": "\n        <h3>Função</h3>\n        <p>O <strong>TIC-39303</strong> está associado à região inferior da E-3907 e ajuda a manter a energia térmica necessária para a separação.</p>\n\n        <div class=\"eq\">T fundo ↑ → stripping de C₄ ↑ → PVR ↓</div>\n        <div class=\"eq\">T fundo ↓ → C₄ no fundo ↑ → PVR ↑</div>\n\n        <p>Essa temperatura funciona como uma variável operacional importante para manter a gasolina dentro da especificação de volatilidade.</p>\n\n        <div class=\"warn\"><strong>Observação:</strong> a corrente exata manipulada pelo TIC deve ser confirmada no P&amp;ID/lógica da unidade, pois a tela isolada não identifica todo o circuito do elemento final.</div>\n        "}, "xv179": {"title": "XV-179 — Alinhamento de rota", "subtitle": "Habilita/isola a rota associada ao envio para E-3908.", "html": "\n        <h3>Função</h3>\n        <p>Pela configuração da tela, a <strong>XV-179</strong> atua como válvula de bloqueio remoto em uma das rotas de saída da região da J-3920.</p>\n\n        <div class=\"flow\">J-3920 → XV-179 → FIC-39198 → E-3908</div>\n\n        <p>Sua função é permitir ou isolar essa rota conforme o alinhamento operacional requerido.</p>\n\n        <div class=\"warn\"><strong>Importante:</strong> permissivos, intertravamentos e lógica de exclusão entre rotas devem ser confirmados na lógica da unidade.</div>\n        "}, "xv180": {"title": "XV-180 — Alinhamento de rota", "subtitle": "Habilita/isola a rota associada ao envio para esfera.", "html": "\n        <h3>Função</h3>\n        <p>Pela configuração da tela, a <strong>XV-180</strong> atua como válvula de bloqueio remoto para a rota alternativa de envio do produto.</p>\n\n        <div class=\"flow\">J-3920 → XV-180 → FIC-39203 → esfera</div>\n\n        <p>Ela permite selecionar/isolar a rota de destino conforme a condição operacional.</p>\n\n        <div class=\"warn\"><strong>Importante:</strong> a lógica exata de seleção e os permissivos entre XV-179 e XV-180 devem ser confirmados no intertravamento da unidade.</div>\n        "}, "summary": {"title": "Resumo — Controle integrado da E-3907", "subtitle": "Como pressão, refluxo, reboil e ΔP se conectam à qualidade dos produtos.", "html": "\n        <h3>Relações principais</h3>\n        <div class=\"eq\">Refluxo → controla principalmente C₅⁺ no topo</div>\n        <div class=\"eq\">Reboil → controla principalmente C₄ no fundo</div>\n        <div class=\"eq\">Pressão → altera o equilíbrio líquido–vapor</div>\n        <div class=\"eq\">ΔP → indica a condição hidráulica da torre</div>\n\n        <h3>Qualidade dos produtos</h3>\n        <ul>\n          <li><strong>PVR alta:</strong> tendência de C₄ excessivo na gasolina.</li>\n          <li><strong>Intemperismo ruim:</strong> tendência de C₅⁺ excessivo no GLP.</li>\n          <li><strong>ΔP alto:</strong> atenção para sobrecarga/flooding.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Ideia central:</strong> corrigir uma especificação sem desequilibrar a outra. Reboil e refluxo devem ser ajustados em conjunto com pressão e capacidade hidráulica.</div>\n        "}};
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelSubtitle = document.getElementById('panelSubtitle');
const panelBody = document.getElementById('panelBody');
const editBtn = document.getElementById('editBtn');
const minBtn = document.getElementById('minBtn');
const closeBtn = document.getElementById('closeBtn');
const saveBtn = document.getElementById('saveBtn');
const resetBtn = document.getElementById('resetBtn');
const pvrBtn = document.getElementById('pvrBtn');
const intBtn = document.getElementById('intBtn');
const floodBtn = document.getElementById('floodBtn');
const summaryBtn = document.getElementById('summaryBtn');
const toast = document.getElementById('toast');

let currentId = null;
let editMode = false;

function keyFor(id) { return 'e3907-interativo-' + id; }

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1300);
}

function persistCurrent(silent=false) {
  if (!currentId || !editMode) return;
  localStorage.setItem(keyFor(currentId), panelBody.innerHTML);
  if (!silent) showToast('Alterações salvas');
}

function highlight(id) {
  document.querySelectorAll('.lamp').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

function render(id) {
  currentId = id;
  highlight(id);
  panel.classList.remove('minimized');
  minBtn.textContent = '—';
  panelTitle.textContent = DATA[id].title;
  panelSubtitle.textContent = DATA[id].subtitle;

  const saved = localStorage.getItem(keyFor(id));
  panelBody.innerHTML = saved !== null ? saved : DATA[id].html;
  panelBody.contentEditable = editMode ? 'true' : 'false';

  panel.classList.add('open');
  panelBody.animate(
    [{opacity:.18,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],
    {duration:170,easing:'ease-out'}
  );
}

function openItem(id) {
  if (!DATA[id]) return;

  if (currentId && currentId !== id) {
    persistCurrent(true);
    panel.classList.add('switching');

    setTimeout(() => {
      panel.classList.remove('switching');
      render(id);
    }, 140);
  } else {
    render(id);
  }
}

document.querySelectorAll('.lamp').forEach(el => {
  el.addEventListener('click', () => openItem(el.dataset.id));
});

pvrBtn.addEventListener('click', () => openItem('pvr'));
intBtn.addEventListener('click', () => openItem('intemperismo'));
floodBtn.addEventListener('click', () => openItem('flooding'));
summaryBtn.addEventListener('click', () => openItem('summary'));

editBtn.addEventListener('click', () => {
  editMode = !editMode;
  document.body.classList.toggle('editmode', editMode);
  editBtn.classList.toggle('active', editMode);
  editBtn.textContent = editMode ? 'Edição ativa' : 'Modo edição';

  if (currentId) panelBody.contentEditable = editMode ? 'true' : 'false';
  showToast(editMode ? 'Modo edição ativado' : 'Modo edição desativado');
});

saveBtn.addEventListener('click', () => {
  if (!currentId) return;
  localStorage.setItem(keyFor(currentId), panelBody.innerHTML);
  showToast('Alterações salvas');
});

resetBtn.addEventListener('click', () => {
  if (!currentId) return;
  if (!confirm('Restaurar o conteúdo original deste item?')) return;

  localStorage.removeItem(keyFor(currentId));
  panelBody.innerHTML = DATA[currentId].html;
  panelBody.contentEditable = editMode ? 'true' : 'false';
  showToast('Conteúdo original restaurado');
});

minBtn.addEventListener('click', () => {
  panel.classList.toggle('minimized');
  minBtn.textContent = panel.classList.contains('minimized') ? '□' : '—';
});

closeBtn.addEventListener('click', () => {
  persistCurrent(true);
  panel.classList.remove('open','minimized','switching');
  highlight(null);
  currentId = null;
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeBtn.click();
});
</script>

<button id="pwaInstallBtn" aria-label="Instalar E-3907 concept">
  📲 Instalar E-3907 concept
</button>

<script>
let deferredInstallPrompt = null;
const pwaInstallBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if (pwaInstallBtn) pwaInstallBtn.classList.add('show');
});

if (pwaInstallBtn) {
  pwaInstallBtn.addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      pwaInstallBtn.classList.remove('show');
    } else {
      const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isiOS) {
        alert('No iPhone/iPad: toque em Compartilhar e depois em “Adicionar à Tela de Início”.');
      } else {
        alert('Se a instalação não abrir automaticamente, use o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.');
      }
    }
  });
}

window.addEventListener('appinstalled', () => {
  if (pwaInstallBtn) pwaInstallBtn.classList.remove('show');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.log('Falha ao registrar Service Worker:', err);
    });
  });
}
</script>

</body>
</html>
